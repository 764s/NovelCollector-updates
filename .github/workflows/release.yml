name: Verify and publish public update
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag, for example v2.5.2
        required: true
        type: string
concurrency:
  group: public-release-${{ inputs.tag }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  RELEASE_TAG: ${{ inputs.tag }}
defaults:
  run:
    shell: bash
jobs:
  upload:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Retrieve the staged distribution files
        run: |
          python -c 'import os,re; assert re.fullmatch(r"v\d+\.\d+\.\d+", os.environ["RELEASE_TAG"])'
          git fetch --depth=1 origin "refs/heads/candidate/${RELEASE_TAG#v}"
          mkdir incoming
          git archive FETCH_HEAD | tar -x -C incoming
      - name: Upload verified distribution assets to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python qa/public_release_candidate.py upload "$RELEASE_TAG"
  preflight:
    needs: upload
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            suffix: .zip
          - os: ubuntu-24.04
            platform: linux-x64
            suffix: .tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    outputs:
      windows_fingerprint: ${{ steps.download.outputs.windows_fingerprint }}
      linux_fingerprint: ${{ steps.download.outputs.linux_fingerprint }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Read the public candidate and verify its digests
        id: download
        run: |
          python -c 'import os,re; assert re.fullmatch(r"v\d+\.\d+\.\d+", os.environ["RELEASE_TAG"])'
          git fetch --depth=1 origin "refs/heads/candidate/${RELEASE_TAG#v}"
          mkdir incoming
          git archive FETCH_HEAD | tar -x -C incoming
          python qa/public_release_candidate.py download "$RELEASE_TAG"
      - name: Verify native install, backup, rollback and packaged tests
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
          PACKAGE_SUFFIX: ${{ matrix.suffix }}
        run: |
          version="${RELEASE_TAG#v}"
          python qa/verify_public_release.py --package "candidate/NovelCollector-${version}-${PACKAGE_PLATFORM}${PACKAGE_SUFFIX}" --archive "candidate/NovelCollector-${version}-app-only.zip" --output preflight.json
  publish:
    needs: preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Promote the exact verified candidate
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_FINGERPRINT: ${{ needs.preflight.outputs.windows_fingerprint }}
          LINUX_FINGERPRINT: ${{ needs.preflight.outputs.linux_fingerprint }}
        run: python qa/public_release_candidate.py promote "$RELEASE_TAG"
  online:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Anonymous public download and real online installation
        run: python qa/verify_public_release.py --online --tag "$RELEASE_TAG" --output online.json
  receipt:
    needs: [preflight, online]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Record successful Windows and Linux anonymous updates
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_FINGERPRINT: ${{ needs.preflight.outputs.windows_fingerprint }}
          LINUX_FINGERPRINT: ${{ needs.preflight.outputs.linux_fingerprint }}
        run: |
          python qa/public_release_candidate.py receipt "$RELEASE_TAG"
          python - <<'PYCODE'
          import os, subprocess, tempfile
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args]).decode().strip()
          target = 'refs/heads/release-status/' + os.environ['RELEASE_TAG'][1:]
          parents = []
          if git('ls-remote', '--heads', 'origin', target):
              git('fetch', '--no-tags', 'origin', target)
              parents = ['-p', git('rev-parse', 'FETCH_HEAD')]
          with tempfile.TemporaryDirectory() as temp:
              os.environ['GIT_INDEX_FILE'] = str(Path(temp) / 'index')
              git('read-tree', '--empty')
              blob = git('hash-object', '-w', 'release-status.json')
              git('update-index', '--add', '--cacheinfo', '100644,' + blob + ',release-status.json')
              tree = git('write-tree')
              commit = git('-c', 'user.name=github-actions[bot]', '-c', 'user.email=41898282+github-actions[bot]@users.noreply.github.com', 'commit-tree', tree, *parents, '-m', 'Verify public update ' + os.environ['RELEASE_TAG'])
              git('push', 'origin', commit + ':' + target)
          PYCODE
